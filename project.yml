name: DualPresenter
options:
  bundleIdPrefix: com.gergeisabo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_DEBUG_DYLIB: NO
    ENABLE_EMBEDDED_CONTENT_CONTAINS_SWIFT: NO
targets:
  DualPresenter:
    type: application
    platform: iOS
    sources:
      - App/Sources
    dependencies:
      - target: BroadcastUpload
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: DualPresenter
        UILaunchScreen: {}
        NSCameraUsageDescription: DualPresenter records the back camera view of the content you present.
        NSMicrophoneUsageDescription: DualPresenter records your voice together with the presentation.
        NSPhotoLibraryAddUsageDescription: DualPresenter saves finished videos to your photo library.
        UIBackgroundModes:
          - audio
          - voip
    entitlements:
      path: App/DualPresenter.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.gergeisabo.dualpresenter
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: YOUR_TEAM_ID
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
  BroadcastUpload:
    type: app-extension
    platform: iOS
    sources:
      - BroadcastUpload
      - path: App/Sources/FrameBridge.swift
    dependencies:
      - sdk: ReplayKit.framework
      - sdk: CoreMedia.framework
    info:
      path: BroadcastUpload/Info.plist
      properties:
        CFBundleDisplayName: BroadcastUpload
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
    entitlements:
      path: BroadcastUpload/BroadcastUpload.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.gergeisabo.dualpresenter
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: YOUR_TEAM_ID
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.gergeisabo.DualPresenter.BroadcastUpload
        ENABLE_USER_SCRIPT_SANDBOXING: NO
  DualPresenterTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: DualPresenter
    info:
      path: Tests/Info.plist
schemes:
  DualPresenter:
    build:
      targets:
        DualPresenter: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DualPresenterTests
